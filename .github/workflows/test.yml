name: Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        php: ["8.2", "8.3", "8.4"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo, sqlite, pdo_sqlite, dom, curl, libxml, mbstring, zip, pcntl
          coverage: none

      - name: Install dependencies
        run: composer update --prefer-dist --no-progress --no-suggest --no-interaction

      - name: Run Tests
        run: vendor/bin/pest
